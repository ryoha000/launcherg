name: Release candidate

on:
  pull_request:
  push:
    branches: ['release/**']
    tags: ['*.*.*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ github.event_name != 'pull_request' && (secrets.TAURI_SIGNING_PRIVATE_KEY || secrets.TAURI_PRIVATE_KEY) || '' }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ github.event_name != 'pull_request' && (secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || secrets.TAURI_KEY_PASSWORD) || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.9
      - uses: dtolnay/rust-toolchain@stable
      - uses: arduino/setup-task@v2
        with:
          version: 3.48.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true
      - name: Install locked dependencies
        run: |
          npm ci
          pnpm --dir browser-extension install --frozen-lockfile
      - name: Validate release version
        run: node scripts/check-release-version.mjs
      - name: Validate frontend production assets
        run: npm run build
      - name: Build bundled integration resources
        run: |
          task build:extension
          node scripts/stage-release-resources.mjs
      - name: Check all application packages
        run: task check
      - name: Build Windows installer
        run: task build:release
      - name: Exercise the real native host with isolated data
        run: node scripts/native-host-smoke.mjs
      - name: Collect signed updater and extension
        shell: pwsh
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'pull_request') {
            node scripts/collect-release-artifacts.mjs
          } else {
            node scripts/collect-release-artifacts.mjs --require-signature
          }
          $releaseVersion = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          Compress-Archive -Path browser-extension/dist/* -DestinationPath "release-artifacts/launcherg-extension-$releaseVersion.zip" -Force
          Copy-Item docs/releases/0.4.0.md release-artifacts/RELEASE-NOTES.md
      - uses: actions/upload-artifact@v4
        with:
          name: launcherg-windows-${{ github.sha }}
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 14

  draft-prerelease:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: launcherg-windows-${{ github.sha }}
          path: release-artifacts
      - name: Create draft prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release-artifacts/* --verify-tag --draft --prerelease --title "Launcherg $RELEASE_TAG" --notes-file release-artifacts/RELEASE-NOTES.md
